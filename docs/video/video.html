<!doctype html><html><head><meta charset="utf-8"><title>Kalwings walkthrough</title>
<style>
:root{--bg:#0e0e11;--card:#17171c;--ink:#f5f2ec;--soft:#a09ea8;--or:#ff5b2e;--or2:#ff8a65;--mint:#8cf0be;--lilac:#c9b8ff;--sun:#ffd66b}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
#stage{position:relative;width:1280px;height:720px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 18s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:#7c2ff6;left:-120px;top:-160px}.b2{width:480px;height:480px;background:#ff5b2e;right:-140px;bottom:-200px;animation-delay:-6s}.b3{width:380px;height:380px;background:#10f27d;right:200px;top:-220px;opacity:.14;animation-delay:-11s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.scene{position:absolute;inset:0;opacity:0;transform:scale(1.02);transition:opacity .5s ease,transform .6s ease;pointer-events:none}
.scene.in{opacity:1;transform:scale(1)}
.brand{position:absolute;left:34px;top:22px;font-weight:800;letter-spacing:.2em;font-size:15px;display:flex;gap:6px;align-items:baseline;z-index:5}
.brand .k{color:var(--mint);font-size:22px;letter-spacing:0}.brand .w{background:linear-gradient(90deg,#7c2ff6,#10f27d);-webkit-background-clip:text;color:transparent}
/* title */
.t-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.t-logo{font-weight:800;font-size:120px;letter-spacing:.14em;display:flex;align-items:baseline;gap:10px}
.t-logo .k{color:var(--mint);letter-spacing:0;transform:translateY(40px) scale(.6);opacity:0;animation:pop .8s .1s cubic-bezier(.2,1.4,.4,1) forwards}
.t-logo .w{background:linear-gradient(90deg,#7c2ff6,#10f27d);-webkit-background-clip:text;color:transparent;clip-path:inset(0 100% 0 0);animation:wipe 1s .5s ease forwards}
@keyframes pop{to{transform:none;opacity:1}}@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.t-kicker{margin-top:18px;color:var(--or2);letter-spacing:.3em;text-transform:uppercase;font-weight:700;font-size:20px;opacity:0;animation:up .7s 1.3s ease forwards}
.t-sub{margin-top:12px;font-size:28px;color:#d8d6de;opacity:0;animation:up .7s 1.8s ease forwards}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.t-line{width:0;height:4px;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:3px;margin-top:26px;animation:grow 1s 1.1s ease forwards}@keyframes grow{to{width:360px}}
/* rules */
.r-wrap{position:absolute;left:90px;right:90px;top:70px}
.h-title{font-size:46px;font-weight:800;margin-bottom:26px;opacity:0;animation:up .6s .1s ease forwards}.h-title em{font-family:Georgia,serif;color:var(--or2);font-weight:400}
.rule{display:flex;gap:20px;align-items:center;background:var(--card);border:1px solid #2c2c34;border-radius:20px;padding:15px 22px;margin:11px 0;opacity:0;transform:translateX(-60px)}
.rule.show{animation:slide .6s ease forwards}@keyframes slide{to{opacity:1;transform:none}}
.rule .n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:800;font-size:22px;color:#0e0e11}
.rule b{display:block;font-size:24px}.rule span{color:var(--soft);font-size:17px}
/* section */
.s-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:0}
.s-label{color:var(--or);font-weight:800;letter-spacing:.3em;font-size:22px;text-transform:uppercase;opacity:0;animation:up .6s .1s forwards}
.s-title{font-size:110px;font-weight:800;opacity:0;animation:up .7s .35s forwards}.s-sub{font-size:30px;color:var(--soft);opacity:0;animation:up .7s .7s forwards}
.s-bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--or);animation:barw .8s .1s ease forwards}@keyframes barw{to{width:14px}}
/* shot scene */
.s-head{position:absolute;left:34px;right:34px;top:56px;display:flex;align-items:center;gap:14px;z-index:4}
.s-head h2{font-size:30px;font-weight:800}.chip{background:#23232b;border:1px solid #34343e;border-radius:99px;padding:5px 14px;font-size:14px;color:var(--soft)}
.view{position:absolute;left:50px;top:108px;width:1180px;height:500px;border-radius:18px;overflow:hidden;background:#0a0a0c;border:1px solid #2d2d36;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.page{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,.05,.25,1);will-change:transform}
.page img{display:block;user-select:none}
.hl{position:absolute;border:4px solid var(--or);border-radius:12px;opacity:0;transform:scale(1.06);transition:opacity .4s,transform .4s,border-color .4s;box-shadow:0 0 0 0 rgba(255,91,46,.6)}
.hl.on{opacity:1;transform:none;border-color:#ff2d55;animation:pulse 1.3s ease-out infinite}.hl.done{opacity:.55;transform:none;border-color:#ff8a65}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}100%{box-shadow:0 0 0 22px rgba(255,45,85,0)}}
.badge{position:absolute;width:34px;height:34px;border-radius:50%;background:#ff2d55;color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff;left:-17px;top:-17px}
.cursor{position:absolute;width:30px;height:30px;transition:left 1s cubic-bezier(.45,.05,.25,1),top 1s cubic-bezier(.45,.05,.25,1);z-index:6;transform-origin:0 0}
.ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #ffd66b;opacity:0;z-index:5}.ripple.go{animation:rip .8s ease-out}@keyframes rip{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
.cap{position:absolute;left:50px;right:50px;bottom:30px;min-height:78px;background:rgba(23,23,28,.94);border:1px solid #34343e;border-radius:20px;padding:16px 24px;display:flex;gap:18px;align-items:center;z-index:5;backdrop-filter:blur(8px)}
.cap{opacity:0;transition:opacity .4s}.cap.on{opacity:1}
.cap .cn{flex:none;width:44px;height:44px;border-radius:50%;background:#ff2d55;font-weight:800;font-size:22px;display:grid;place-items:center}
.cap .tx{font-size:24px;line-height:1.3;opacity:0;transform:translateY(10px)}.cap .tx.show{animation:up .5s ease forwards}
.dots{position:absolute;right:34px;top:66px;display:flex;gap:7px;z-index:4}.dots i{width:10px;height:10px;border-radius:50%;background:#33333b;transition:.3s}.dots i.on{background:var(--or);transform:scale(1.35)}
/* flow */
.f-wrap{position:absolute;inset:0}.node{position:absolute;width:210px;height:104px;border-radius:20px;background:var(--card);border:2px solid #34343e;display:grid;place-items:center;text-align:center;font-weight:700;font-size:20px;opacity:0;transform:scale(.8);transition:.5s}
.node small{display:block;font-weight:500;color:var(--soft);font-size:14px;margin-top:4px}.node.on{opacity:1;transform:none;border-color:var(--or)}
.arrow{position:absolute;height:4px;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:3px;width:0;transition:width .7s ease;opacity:.9}
.arrow:after{content:"";position:absolute;right:-2px;top:-8px;border-left:16px solid var(--or2);border-top:10px solid transparent;border-bottom:10px solid transparent;opacity:0;transition:opacity .3s .6s}.arrow.on:after{opacity:1}
.packet{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--mint);box-shadow:0 0 16px var(--mint);opacity:0}
.note{position:absolute;left:90px;right:90px;bottom:36px;font-size:24px;text-align:center;color:#d8d6de;opacity:0;transition:.5s}.note.on{opacity:1}
/* step stack */
.k-wrap{position:absolute;left:150px;right:150px;top:112px}
.step{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid #2c2c34;border-radius:18px;padding:13px 22px;margin:10px 0;opacity:0;transform:translateY(24px);transition:.5s}
.step.on{opacity:1;transform:none}.step.cur{border-color:var(--or);box-shadow:0 0 30px rgba(255,91,46,.25)}
.step .i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:800;font-size:21px;color:#0e0e11}
.step code{font:700 22px "DejaVu Sans Mono",monospace;color:var(--mint);min-width:300px}.step span{color:#d0ced6;font-size:20px}
.step .ok{margin-left:auto;color:var(--mint);font-size:28px;opacity:0;transition:.3s}.step.done .ok{opacity:1}
/* quality */
.q-wrap{position:absolute;left:90px;right:90px;top:120px}.pills{display:flex;gap:16px;margin:10px 0 36px}
.pill{padding:16px 30px;border-radius:99px;background:var(--card);border:2px solid #34343e;font-weight:700;font-size:24px;opacity:0;transform:translateY(16px);transition:.4s}.pill.on{opacity:1;transform:none}.pill.ok{border-color:var(--mint);color:var(--mint)}
.ci{display:flex;gap:24px}.ci .box{flex:1;background:var(--card);border:2px solid #34343e;border-radius:22px;padding:22px;font-size:26px;font-weight:700;opacity:0;transition:.5s}.ci .box.on{opacity:1}.ci .box.ok{border-color:var(--mint)}
.ci .bar{height:10px;border-radius:6px;background:#2a2a32;margin-top:16px;overflow:hidden}.ci .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--mint));transition:width 1.6s ease}
.deploy{margin-top:34px;font-size:26px;opacity:0;transition:.6s;display:flex;gap:14px;align-items:center}.deploy.on{opacity:1}.deploy b{color:var(--or2)}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--or),var(--mint));width:0;z-index:20}
</style></head><body><div id="stage"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="prog"></div></div>
<script>
const S = document.getElementById('stage');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const words = (t) => t.split(/\s+/).length;
const stepMs = (t) => Math.max(3000, words(t) * 330 + 1500);
let BOX = {}, SC = [], total = 0, elapsed = 0;
const brand = '<div class="brand"><span class="k">K</span><span class="w">ALWINGS</span></div>';
async function mount(html, cls = 'scene') { const e = el(`<div class="${cls} scene">${brand}${html}</div>`); S.appendChild(e); await sleep(30); e.classList.add('in'); return e; }
async function leave(e) { e.classList.remove('in'); await sleep(550); e.remove(); }
const prog = () => { document.getElementById('prog').style.width = Math.min(100, (performance.now() - t0) / est * 100) + '%'; };
let t0 = performance.now(), est = 240000;

async function title(s) { const e = await mount(`<div class="t-wrap"><div class="t-logo"><span class="k">K</span><span class="w">ALWINGS</span></div><div class="t-line"></div><div class="t-kicker">${s.kicker}</div><div class="t-sub">${s.sub}</div></div>`); await sleep(4200); await leave(e); }
async function section(s) { const e = await mount(`<div class="s-bar"></div><div class="s-wrap"><div class="s-label">${s.sub}</div><div class="s-title">${s.title}</div></div>`); await sleep(2200); await leave(e); }
async function rules(s) {
  const e = await mount(`<div class="r-wrap"><div class="h-title">Five rules that <em>never</em> change</div>${s.items.map((r, i) => `<div class="rule"><div class="n">${i + 1}</div><div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join('')}</div>`);
  const rs = [...e.querySelectorAll('.rule')]; await sleep(900);
  for (const r of rs) { r.classList.add('show'); await sleep(1700); }
  await sleep(1500); await leave(e);
}
async function shot(s) {
  const info = BOX[s.img]; const W = info.w, H = info.h; const VW = 1180, VH = 500;
  const e = await mount(`<div class="s-head"><h2>${s.title}</h2><span class="chip">Step by step</span></div><div class="dots">${s.steps.map(() => '<i></i>').join('')}</div>
    <div class="view"><div class="page" style="width:${W}px;height:${H}px"><img src="/manual/img-clean/${s.img}.png" width="${W}" height="${H}">
    ${info.boxes.map((b) => `<div class="hl" data-n="${b.n}" style="left:${b.x - 6}px;top:${b.y - 6}px;width:${b.w + 12}px;height:${b.h + 12}px"><div class="badge" style="transform:scale(var(--inv,1))">${b.n}</div></div>`).join('')}
    <svg class="cursor" viewBox="0 0 24 24" style="left:${W / 2}px;top:${Math.min(H, 300)}px"><path d="M3 2l16 9-7 2 4 8-3 1.5-4-8-6 5z" fill="#fff" stroke="#111" stroke-width="1.5"/></svg><div class="ripple"></div></div></div>
    <div class="cap"><div class="cn">1</div><div class="tx"></div></div>`);
  const page = e.querySelector('.page'), cur = e.querySelector('.cursor'), rip = e.querySelector('.ripple'), tx = e.querySelector('.tx'), cn = e.querySelector('.cn'), dots = [...e.querySelectorAll('.dots i')];
  const fit = Math.max(Math.min(VW / W, VH / H), 0.6);
  const cam = (sc, tx_, ty_) => { page.style.transform = `translate(${tx_}px,${ty_}px) scale(${sc})`; page.style.setProperty('--inv', 1 / sc); e.querySelectorAll('.badge').forEach((b) => b.style.transform = `scale(${1 / sc})`); cur.style.transform = `scale(${1 / sc})`; };
  const clampT = (v, size, view) => (size <= view ? (view - size) / 2 : Math.min(0, Math.max(view - size, v)));
  const ovT = () => [clampT((VW - W * fit) / 2, W * fit, VW), H * fit > VH ? 0 : (VH - H * fit) / 2];
  cam(fit, ...ovT());
  await sleep(1200);
  // gentle overview pan for tall pages
  let first = true, k = 0;
  for (const st of s.steps) {
    const b = info.boxes.find((x) => x.n === st.n); if (!b) continue;
    const sc = Math.max(0.85, Math.min(1.9, 1000 / (b.w * 1.2), 400 / (b.h * 1.4)));
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const tX = clampT(VW / 2 - cx * sc, W * sc, VW), tY = clampT(VH / 2 - cy * sc, H * sc, VH);
    cam(sc, tX, tY);
    cur.style.left = (cx + Math.min(b.w / 3, 120)) + 'px'; cur.style.top = (cy) + 'px';
    e.querySelectorAll('.hl.on').forEach((h) => { h.classList.remove('on'); h.classList.add('done'); });
    const hl = e.querySelector(`.hl[data-n="${st.n}"]`); hl.classList.remove('done');
    await sleep(900); hl.classList.add('on'); rip.style.left = (cx + Math.min(b.w / 3, 120)) + 'px'; rip.style.top = cy + 'px'; rip.classList.remove('go'); void rip.offsetWidth; rip.classList.add('go');
    dots.forEach((d, i) => d.classList.toggle('on', i <= k)); k++;
    e.querySelector('.cap').classList.add('on'); cn.textContent = st.n; tx.classList.remove('show'); tx.textContent = st.cap; void tx.offsetWidth; tx.classList.add('show');
    await sleep(stepMs(st.cap) - 900);
  }
  e.querySelectorAll('.hl').forEach((h) => { h.classList.remove('on'); h.classList.add('done'); });
  cam(fit, ...ovT()); e.querySelector('.cap').classList.remove('on'); await sleep(1100); await leave(e);
}
async function flow(s) {
  const N = [['Browser', 'user opens a page', 60, 140], ['Next.js page', 'requirePageRole()', 350, 140], ['Prisma', 'scoped queries', 640, 140], ['MySQL / MariaDB', 'Hostinger', 930, 140]];
  const e = await mount(`<div class="h-title" style="position:absolute;left:90px;top:70px;font-size:40px">${s.title}</div><div class="f-wrap">${N.map((n, i) => `<div class="node" id="n${i}" style="left:${n[2]}px;top:${n[3] + 80}px">${n[0]}<small>${n[1]}</small></div>`).join('')}
    ${[0, 1, 2].map((i) => `<div class="arrow" id="a${i}" style="left:${N[i][2] + 214}px;top:${N[i][3] + 130}px;--w:${N[i + 1][2] - N[i][2] - 224}px"></div>`).join('')}
    <div class="packet" id="pk" style="left:70px;top:${N[0][3] + 122}px"></div>
    <div class="node" id="chk" style="left:350px;top:420px;width:300px;height:90px;border-color:#7c2ff6">kw_session cookie<small>JWT verified, user re-read from DB</small></div>
    <div class="node" id="sus" style="left:690px;top:420px;width:300px;height:90px;border-color:#ff2d55">Suspended or wrong role<small>redirected at once</small></div>
    <div class="note" id="nt"></div></div>`);
  const $ = (id) => e.querySelector('#' + id); const nt = $('nt');
  for (let i = 0; i < 4; i++) { $('n' + i).classList.add('on'); if (i) { const a = $('a' + (i - 1)); a.style.width = getComputedStyle(a).getPropertyValue('--w'); a.classList.add('on'); } await sleep(700); }
  const pk = $('pk'); pk.style.transition = 'left 3.2s ease-in-out, opacity .3s'; pk.style.opacity = 1; pk.style.left = '980px';
  nt.textContent = 'A request travels left to right and the database is always the source of truth.'; nt.classList.add('on'); await sleep(3400); pk.style.opacity = 0;
  $('chk').classList.add('on'); nt.classList.remove('on'); await sleep(500); nt.textContent = 'Every request re-reads the user, so a suspension or role change applies on the very next click.'; nt.classList.add('on'); await sleep(1500);
  $('sus').classList.add('on'); await sleep(3600); await leave(e);
}
async function steps(s, kind) {
  const e = await mount(`<div class="h-title" style="position:absolute;left:150px;top:60px;font-size:38px">${s.title}</div><div class="k-wrap" style="top:${kind === 'actions' ? 130 : 130}px">${s.steps.map((st, i) => `<div class="step"><div class="i">${i + 1}</div><code>${st[0]}</code><span>${st[1]}</span><div class="ok">✓</div></div>`).join('')}</div>`);
  const rows = [...e.querySelectorAll('.step')]; await sleep(700);
  for (const r of rows) { rows.forEach((x) => x.classList.remove('cur')); r.classList.add('on', 'cur'); await sleep(1900); r.classList.add('done'); }
  await sleep(1500); await leave(e);
}
async function quality(s) {
  const e = await mount(`<div class="h-title" style="position:absolute;left:90px;top:60px;font-size:38px">${s.title}</div><div class="q-wrap" style="top:150px"><div class="pills">${s.gates.map((g) => `<div class="pill">${g}</div>`).join('')}</div>
    <div class="ci">${s.ci.map((c) => `<div class="box">CI: ${c}<div class="bar"><i></i></div></div>`).join('')}</div><div class="deploy">Merge to <b>main</b> → Hostinger builds → migrations apply → <b>/api/health</b> ✓</div></div>`);
  const pills = [...e.querySelectorAll('.pill')]; await sleep(600);
  for (const p of pills) { p.classList.add('on'); await sleep(450); p.classList.add('ok'); await sleep(350); }
  const boxes = [...e.querySelectorAll('.box')]; boxes.forEach((b) => b.classList.add('on')); await sleep(500);
  boxes.forEach((b) => b.querySelector('i').style.width = '100%'); await sleep(2000); boxes.forEach((b) => b.classList.add('ok'));
  await sleep(600); e.querySelector('.deploy').classList.add('on'); await sleep(3200); await leave(e);
}
async function outro(s) { const e = await mount(`<div class="t-wrap"><div class="t-logo" style="font-size:90px"><span class="k">K</span><span class="w">ALWINGS</span></div><div class="t-line"></div><div class="t-kicker">${s.title}</div><div class="t-sub">${s.sub}</div></div>`); await sleep(5200); await leave(e); }
(async () => {
  BOX = await (await fetch('/manual/img-clean/boxes.json')).json(); SC = await (await fetch('/video/scenes.json')).json();
  est = SC.reduce((a, s) => a + (s.type === 'shot' ? 2300 + s.steps.reduce((x, st) => x + stepMs(st.cap), 0) + 1700 : 7000), 0); window.__est = est; t0 = performance.now(); setInterval(prog, 200);
  await sleep(300);
  for (const s of SC) { const f = { title, rules, section, shot, flow, outro, quality }[s.type]; if (s.type === 'actions' || s.type === 'migrate') await steps(s, s.type); else await f(s); }
  window.__done = true;
})();
</script></body></html>
